<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <button class="btn btn-outline-secondary theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()"
    title="Toggle dark/light mode">
    🌙
  </button>
  
  <div class="container py-4">
    <div class="row justify-content-center mb-4">
      <div class="col-lg-10 col-md-12">
        <div class="border border-dotted border-3 rounded-3 p-3 bg-white bg-opacity-50">
          <h4 class="text-center group-header mb-0">VUNA CALCULATOR</h4>
          <p class="text-center text-small text-muted mb-0">
            <i>Created by set 2025/26 Software Engineering With Nerat</i>
          </p>
        </div>
      </div>
    </div>

    <div class="row justify-content-center g-4 align-items-start">
      
      <div class="col-lg-7 col-md-12">
        <div class="card calculator-card">
          <div class="card-body p-4">
            <div class="calculator">
              <div class="display-container">
                <input type="text" class="form-control" id="result" placeholder="0" disabled />
              </div>

              <div class="btn-grid">
                <button class="btn btn-light" onclick="bracketToResult('(')">(</button>
                <button class="btn btn-light" onclick="bracketToResult(')')">)</button>
                <button class="btn btn-light" onclick="backspace()">←</button>

                <button class="btn btn-action" onclick="clearResult()">AC</button>

                <button class="btn btn-light" onclick="appendToResult(7)">7</button>
                <button class="btn btn-light" onclick="appendToResult(8)">8</button>
                <button class="btn btn-light" onclick="appendToResult(9)">9</button>

                <button class="btn btn-operator" onclick="operatorToResult('/')">÷</button>
                <button class="btn btn-light" onclick="appendToResult(4)">4</button>
                <button class="btn btn-light" onclick="appendToResult(5)">5</button>
                <button class="btn btn-light" onclick="appendToResult(6)">6</button>

                <button class="btn btn-operator" onclick="operatorToResult('*')">×</button>
                <button class="btn btn-light" onclick="appendToResult(1)">1</button>
                <button class="btn btn-light" onclick="appendToResult(2)">2</button>
                <button class="btn btn-light" onclick="appendToResult(3)">3</button>

                <button class="btn btn-operator" onclick="operatorToResult('+')">+</button>
                <button class="btn btn-light" onclick="appendToResult('.')">.</button>
                <button class="btn btn-light" onclick="appendToResult(0)">0</button>
                <button class="btn btn-operator" onclick="percentToResult('%')">%</button>
                
                <button class="btn btn-operator" onclick="operatorToResult('-')">−</button>

                <button class="btn btn-equals" onclick="calculateResult()" style="grid-column: span 4;">=</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4 col-md-8">
        <div class="d-grid gap-2">
          <button id="toggle-history-btn" class="btn btn-primary w-100" onclick="toggleHistory()">Show History</button>
        </div>
        
        <div id="history-column" class="mt-3 d-none">
          <div class="card bg-white bg-opacity-75 border-0 rounded-3">
            <div class="card-body p-3">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <p class="text-muted mb-0 fw-bold" style="letter-spacing:1px;">CALCULATION HISTORY</p>
                <button id="clear-history-btn"
                  style="color: red; outline: none; background-color: transparent; border: none; font-size: 0.9rem;"
                  onclick="clearHistory()">Clear All</button>
              </div>
              <div id="history-list"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <template id="history-empty-template">
    <div class="text-center text-muted py-5">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor"
        class="bi bi-clock-history mb-2 opacity-25" viewBox="0 0 16 16">
        <path
          d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022l-.074.997zm2.004.45a7.003 7.003 0 0 0-.985-.299l.219-.976c.383.086.76.2 1.126.342l-.36.933zm1.37.71a7.01 7.01 0 0 0-.439-.27l.493-.87a8.025 8.025 0 0 1 .979.654l-.615.789a6.996 6.996 0 0 0-.418-.302zm1.834 1.79a6.99 6.99 0 0 0-.653-.796l.724-.69c.27.285.52.59.747.91l-.818.576zm.744 1.352a7.08 7.08 0 0 0-.214-.468l.893-.45a7.976 7.976 0 0 1 .45 1.088l-.95.313a7.023 7.023 0 0 0-.179-.483zm.53 2.507a6.991 6.991 0 0 0-.1-1.025l.985-.17c.067.386.106.778.116 1.17l-1 .025zm-.131 1.538c.033-.17.06-.339.081-.51l.993.123a7.957 7.957 0 0 1-.23 1.155l-.964-.267c.046-.165.086-.332.12-.501zm-.952 2.379c.184-.29.346-.594.486-.908l.914.405c-.16.36-.345.706-.555 1.038l-.845-.535zm-.964 1.205c.122-.122.239-.248.35-.378l.758.653a8.073 8.073 0 0 1-.401.432l-.707-.707z" />
        <path d="M8 1a7 7 0 1 0 4.95 11.95l.707.707A8.001 8.001 0 1 1 8 0v1z" />
        <path
          d="M7.5 3a.5.5 0 0 1 .5.5v5.21l3.248 1.856a.5.5 0 0 1-.496.868l-3.5-2A.5.5 0 0 1 7 9V3.5a.5.5 0 0 1 .5-.5z" />
      </svg>
      <p class="mb-0">No calculations yet</p>
    </div>
  </template>

  <template id="history-item-template">
    <div class="history-item">
      <div class="history-item-expression"></div>
      <div class="history-item-words"></div>
      <div class="remark-text"></div>
      <div class="history-actions">
        <button class="history-action-btn btn-delete">🗑 Delete</button>
        <button class="history-action-btn btn-remark">📝 Comment</button>
      </div>

      <div class="remark-box d-none">
        <input type="text" placeholder="Add remark..." />
        <button class="btn btn-sm btn-primary">Set</button>
        <button class="btn btn-sm btn-outline-secondary">✕</button>
      </div>
      <div class="history-item-time"></div>
    </div>
  </template>

  <script src="assets/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="assets/js/script.js"></script>
  <button id="scroll-to-calculator" title="Back to Calculator">↑</button>
</body>

</html>
